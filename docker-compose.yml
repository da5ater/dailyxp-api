services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dailyxp
      POSTGRES_PASSWORD: dailyxp
      POSTGRES_DB: dailyxp_api_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailyxp"]
      interval: 5s
      retries: 5
  api:
    build: .
    command: bundle exec puma -C config/puma.rb
    environment:
      DATABASE_URL: postgres://dailyxp:dailyxp@db:5432/dailyxp_api_development
      STORAGE_ADAPTER: ${STORAGE_ADAPTER:-filesystem}
      RAILS_ENV: development
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
  proxy:
    image: nginx:alpine
    ports: ["80:80"]
    depends_on: [api]
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
volumes:
  pgdata:
